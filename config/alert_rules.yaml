alerts:
  - name: high_request_latency
    severity: warning
    condition: 'p95(latency_ms) > 3000 over 10m'
    duration: 10m
    type: symptom-based
    channel: 'slack:#llmops-alerts'
    owner: platform-oncall
    runbook: docs/alerts.md#high-request-latency
  - name: elevated_request_error_rate
    severity: critical
    condition: 'error_rate_pct > 2 over 5m'
    duration: 5m
    type: symptom-based
    channel: 'slack:#llmops-alerts'
    owner: platform-oncall
    runbook: docs/alerts.md#elevated-request-error-rate
  - name: degraded_answer_quality
    severity: warning
    condition: 'avg(quality_score) < 0.75 over 15m'
    duration: 15m
    type: symptom-based
    channel: 'slack:#llmops-alerts'
    owner: llm-application-oncall
    runbook: docs/alerts.md#degraded-answer-quality
